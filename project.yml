name: MotoTracker
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  MotoTracker:
    type: application
    platform: iOS
    sources: [MotoTracker]
    info:
      path: MotoTracker/Info.plist
      properties:
        CFBundleDisplayName: MotoTracker
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: MotoTracker uses your location to record your ride route and speed.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allow location access so rides keep recording while the app is in the background.
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.logan.mototracker
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
schemes:
  MotoTracker:
    build:
      targets:
        MotoTracker: all
